<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <style>
        .modern-form-card {
            background: #fff; /* خلفية صلبة لرفع التباين */
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 2px solid rgba(212, 175, 55, 0.2); /* حدود أوضح */
            transition: all 0.3s ease;
        }
        body.dark-mode .modern-form-card {
            background: #16243d; /* خلفية أغمق وأوضح في النايت مود */
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }

        .input-group-modern {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group-modern label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .input-group-modern .form-control,
        .input-group-modern .form-select {
            border-radius: 12px;
            padding: 14px 18px;
            border: 2px solid #eee; /* حدود واضحة في اللايت مود */
            background: #fdfdfd;
            color: #333;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        body.dark-mode .input-group-modern .form-control,
        body.dark-mode .input-group-modern .form-select {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .input-group-modern .form-control:focus,
        .input-group-modern .form-select:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.15);
            outline: none;
        }

        body.dark-mode .input-group-modern .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .input-group-modern i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            opacity: 0.6;
            pointer-events: none;
        }

        .input-wrapper-inner {
            position: relative;
        }

        .profile-avatar-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            background: var(--gradient-gold);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: var(--dark);
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            border: 4px solid #fff;
            transition: all 0.3s ease;
        }
        body.dark-mode .avatar-preview { border-color: var(--dark); }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-modern {
            padding: 14px 35px;
            border-radius: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-modern:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .btn-modern:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="tn-navbar"></div>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="close-sidebar" onclick="document.querySelector('.sidebar').classList.remove('open')">
                    <i class="fas fa-times"></i>
                </button>
                <i class="fas fa-user-circle fa-2x" style="color:#d4af37"></i>
                <h3>PROFILE</h3>
                <p id="user-greeting-side">Welcome</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="edit-profile.html" class="active"><i class="fas fa-user-edit"></i> Edit Profile</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
                <li><a href="favorites.html"><i class="fas fa-heart"></i> Favorites</a></li>
                <li><a href="saved-trips.html"><i class="fas fa-route"></i> Saved Trips</a></li>
                <li><a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="javascript:void(0)" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>

            <div class="container-fluid py-4">
                <div class="modern-form-card mx-auto" style="max-width: 800px;">
                    <div class="profile-avatar-section">
                        <div class="avatar-preview" id="avatar-preview">U</div>
                        <h4 style="color: var(--text); margin-bottom: 5px;">Profile Details</h4>
                        <p class="text-muted small">Update your personal information below</p>
                    </div>

                    <form id="edit-profile-form">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="input-group-modern">
                                    <label for="fullName">Full Name</label>
                                    <div class="input-wrapper-inner">
                                        <input type="text" class="form-control" name="fullName" id="fullName" placeholder="Enter your full name" required>
                                        <i class="fas fa-user"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="input-group-modern">
                                    <label for="username">Username</label>
                                    <div class="input-wrapper-inner">
                                        <input type="text" class="form-control" name="username" id="username" placeholder="Choose a unique username" required>
                                        <i class="fas fa-at"></i>
                                    </div>
                                    <div id="username-error" class="text-danger small mt-1" style="display:none"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="input-group-modern">
                                    <label for="email">Email Address</label>
                                    <div class="input-wrapper-inner">
                                        <input type="email" class="form-control" id="email" readonly style="opacity: 0.8; cursor: not-allowed; background: rgba(0,0,0,0.05);">
                                        <i class="fas fa-envelope"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="input-group-modern">
                                    <label for="phone">Phone Number</label>
                                    <div class="input-wrapper-inner">
                                        <input type="tel" class="form-control" name="phone" id="phone" placeholder="+20 1xx xxx xxxx">
                                        <i class="fas fa-phone"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="input-group-modern">
                                    <label for="country">Country / Region</label>
                                    <div class="input-wrapper-inner">
                                        <select class="form-select" name="country" id="country">
                                            <option value="Egypt">Egypt</option>
                                            <option value="Saudi Arabia">Saudi Arabia</option>
                                            <option value="UAE">UAE</option>
                                            <option value="USA">United States</option>
                                            <option value="UK">United Kingdom</option>
                                            <option value="France">France</option>
                                            <option value="Germany">Germany</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-gold btn-modern flex-grow-1">
                                <i class="fas fa-save"></i> SAVE CHANGES
                            </button>
                            <a href="dashboard.html" class="btn btn-outline-secondary btn-modern">
                                <i class="fas fa-times"></i> CANCEL
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/custom-select.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script>
    const user = requireAuth();
    const token = Storage.getToken();
    const authHeaders = token ? { Authorization: `Bearer ${token}` } : {};

    async function loadUserDetails() {
        if (!user) return;

        const updateUI = (u) => {
            document.getElementById('fullName').value = u.fullName || '';
            document.getElementById('username').value = u.username || '';
            document.getElementById('email').value = u.email || '';
            document.getElementById('phone').value = u.phone || '';
            document.getElementById('country').value = u.country || 'Egypt';
            document.getElementById('user-greeting-side').textContent = 'Welcome, ' + (u.fullName || 'Traveler');
            document.getElementById('avatar-preview').textContent = (u.fullName || u.username || 'U').charAt(0).toUpperCase();
        };

        updateUI(user);

        try {
            const res = await fetch('../api/users/profile/details', { headers: authHeaders });
            const data = await res.json();
            if (res.ok && data.user) {
                updateUI(data.user);
            }
        } catch (err) {
            console.error('Failed to fetch latest details:', err);
        }
    }

    document.getElementById('edit-profile-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const origContent = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> UPDATING...';

        const payload = {
            fullName: document.getElementById('fullName').value.trim(),
            username: document.getElementById('username').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            country: document.getElementById('country').value
        };

        try {
            const res = await fetch('../api/users/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    ...authHeaders
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            const usernameError = document.getElementById('username-error');

            if (res.ok) {
                usernameError.style.display = 'none';
                showToast('Changes saved successfully!', 'success');
                const updatedUser = { ...user, ...data.user };
                Storage.set('travelnow-user', updatedUser);

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                if (data.message && data.message.toLowerCase().includes('username')) {
                    usernameError.textContent = data.message;
                    usernameError.style.display = 'block';
                    document.getElementById('username').scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                showToast(data.message || 'Update failed', 'error');
                btn.disabled = false;
                btn.innerHTML = origContent;
            }
        } catch (err) {
            showToast('Unable to reach server. Please try again.', 'error');
            btn.disabled = false;
            btn.innerHTML = origContent;
        }
    };

    loadUserDetails();
    </script>
</body>
</html>
