<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Account Type - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <style>
        .user-type-container {
            margin-top: -120px; /* ارفع العناصر فوق أكثر */
        }
        @media (max-width: 768px) {
            .user-type-container {
                margin-top: -40px;
            }
        }
    </style>
</head>
<body>
    <div id="tn-navbar" data-variant="minimal"></div>
    <div class="user-type-page">
        <div class="user-type-container">
            <h1><i class="fas fa-pyramid"></i> WELCOME TO TRAVELNOW</h1>
            <p>Please choose your account type to continue</p>

            <div class="user-type-cards">
                <a href="javascript:void(0)" class="user-type-card" onclick="selectUserType('tourist')">
                    <i class="fas fa-user-circle"></i>
                    <h3>TOURIST / USER</h3>
                    <p>Discover Egypt's wonders, plan trips, book tours, and share your travel experiences.</p>
                </a>
                <a href="javascript:void(0)" class="user-type-card" onclick="selectUserType('company')">
                    <i class="fas fa-building"></i>
                    <h3>TOURISM COMPANY</h3>
                    <p>Register your company, offer trips, manage bookings, and reach thousands of tourists.</p>
                </a>
            </div>

            <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navbar.js"></script>
</body>
</html>
