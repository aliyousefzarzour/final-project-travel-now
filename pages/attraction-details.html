<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attraction Details - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <style>
        body { background: var(--bg-body); }

        .hero-section {
            height: 42vh; /* نزلتها شوية بسيطة للتوازن */
            width: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: flex-end;
            margin-bottom: -30px;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(5,15,23,0.8) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding-bottom: 50px; /* مسافة مريحة للعين */
        }

        .hero-content h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .location-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            color: #f4e5a3;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .info-stat-card:hover { transform: translateY(-5px); }

        .info-stat-card i {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
        }

        .info-stat-card label {
            display: block;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-stat-card span {
            font-weight: 700;
            color: var(--text);
            font-size: 1.1rem;
        }

        #map {
            height: 400px;
            border-radius: 24px;
            border: 2px solid var(--card-border);
            box-shadow: var(--shadow-soft);
            z-index: 1;
        }

        .booking-sidebar {
            position: sticky;
            top: 100px;
            z-index: 10;
        }

        .price-hero {
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
        }

        .review-card {
            background: rgba(255,255,255,0.03);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--card-border);
        }

        body:not(.dark-mode) .review-card { background: #fff; }

        #favBtn:hover i { color: #e74c3c !important; }

        @media (max-width: 991px) {
            .hero-section { height: 50vh; }
            .booking-sidebar { position: static; margin-top: 30px; }
        }
    </style>
</head>
<body class="has-tn-navbar">
    <div id="tn-navbar" data-page="attractions"></div>

    <div id="page-content">
        <section id="hero" class="hero-section">
            <div class="container hero-content">
                <div class="location-pill mb-3">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="header-location">Loading...</span>
                </div>
                <h1 id="attraction-name" class="font-cinzel">Loading...</h1>
                <div class="d-flex align-items-center gap-3">
                    <div id="header-rating" style="color: #ffc107; font-size: 1.1rem;"></div>
                    <span id="header-reviews" class="text-white-50 small"></span>
                </div>
            </div>
        </section>

        <div class="container pb-5" style="position: relative; z-index: 3;">
            <div class="row">
                <div class="col-lg-8">
                    <!-- Statistics Grid -->
                    <div class="info-grid">
                        <div class="info-stat-card">
                            <i class="fas fa-landmark"></i>
                            <label>Category</label>
                            <span id="stat-category">-</span>
                        </div>
                        <div class="info-stat-card">
                            <i class="fas fa-clock"></i>
                            <label>Opening Hours</label>
                            <span id="stat-hours">-</span>
                        </div>
                        <div class="info-stat-card">
                            <i class="fas fa-ticket-alt"></i>
                            <label>Starting From</label>
                            <span id="stat-price">-</span>
                        </div>
                    </div>

                    <!-- Main Story -->
                    <div class="dashboard-card p-4 p-md-5 mb-4">
                        <h3 class="mb-4" style="color: var(--primary); letter-spacing: 1px;">The Story of this Place</h3>
                        <p id="attraction-description" style="font-size: 1.1rem; line-height: 1.8; color: var(--text); opacity: 0.9; text-align: justify;"></p>

                        <hr class="my-5 opacity-10">

                        <h4 class="mb-4" style="color: var(--primary);"><i class="fas fa-compass me-2"></i> Geographic Location</h4>
                        <div id="map"></div>
                    </div>

                    <!-- Reviews -->
                    <div class="dashboard-card p-4 p-md-5">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="m-0" style="color: var(--primary);"><i class="fas fa-star me-2"></i> Traveler Reviews</h3>
                            <button class="btn btn-gold btn-sm" id="addReviewBtn" data-bs-toggle="modal" data-bs-target="#reviewModal">
                                <i class="fas fa-pen-nib me-1"></i> Add Review
                            </button>
                        </div>
                        <div id="reviews-list">
                            <p class="text-muted text-center py-4">Loading community feedback...</p>
                        </div>
                    </div>
                </div>

                <!-- Booking Sidebar -->
                <div class="col-lg-4">
                    <div class="booking-sidebar">
                        <div class="dashboard-card p-4 text-center">
                            <label class="text-muted small text-uppercase fw-bold letter-spacing-1 mb-2 d-block">Entrance Fee</label>
                            <div class="price-hero mb-1" id="price-display">0 <small style="font-size: 1rem;">EGP</small></div>
                            <p class="text-muted small mb-4">per adult visitor</p>

                            <div class="d-grid gap-2">
                                <button class="btn btn-gold py-3" id="add-to-plan-btn">
                                    <i class="fas fa-plus-circle me-2"></i> ADD TO PLAN
                                </button>
                                <button class="btn btn-outline-gold py-3" id="favBtn">
                                    <i class="far fa-heart me-2"></i> SAVE TO FAVORITES
                                </button>
                            </div>

                            <div class="mt-4 pt-4 border-top border-secondary border-opacity-10 text-start">
                                <h6 class="text-uppercase small fw-bold mb-3" style="color: var(--primary);">Quick Tools</h6>
                                <a id="imagesBtn" href="#" target="_blank" class="text-decoration-none d-block mb-2 py-2" style="color: var(--text);">
                                    <i class="fas fa-images me-2 text-gold"></i> View Gallery
                                </a>
                                <a href="map.html" class="text-decoration-none d-block py-2" style="color: var(--text);">
                                    <i class="fas fa-directions me-2 text-gold"></i> Get Directions
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (Booking & Review) - Unified styling -->
    <div class="modal fade" id="bookingModal" tabindex="-1">
        <!-- ... existing booking modal ... -->
    </div>

    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-modern" style="background: #0F223B !important;">
                <div class="modal-header" style="border-bottom: 1px solid rgba(212,175,55,0.1);">
                    <h5 class="modal-title" id="reviewModalTitle"><i class="fas fa-pen-nib me-2"></i> Write a Review</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="review-form">
                    <input type="hidden" id="review-id">
                    <div class="modal-body p-4">
                        <div class="mb-4 text-center">
                            <div id="modal-stars" style="font-size: 2.5rem; color: #ffc107; cursor: pointer;">
                                <i class="far fa-star" data-r="1"></i>
                                <i class="far fa-star" data-r="2"></i>
                                <i class="far fa-star" data-r="3"></i>
                                <i class="far fa-star" data-r="4"></i>
                                <i class="far fa-star" data-r="5"></i>
                            </div>
                            <p class="text-muted small mt-2">Tap a star to rate your experience</p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Your Experience</label>
                            <textarea class="form-control" id="modal-comment" rows="4" placeholder="What did you like or dislike?" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-gold w-100 py-3" id="review-submit-btn">SUBMIT REVIEW</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script>
        // JS Logic (Mainly kept from original but with UI element mapping updates)
        const DEMO_BOOKINGS_KEY = 'travelnow-demo-bookings';
        const DRAFT_POST_KEY = 'travelnow-draft-post'; // مفتاح الحفظ المؤقت
        const TRIP_PLANNER_ITINERARY_KEY = 'travelnow-trip-planner-itinerary';
        const urlParams = new URLSearchParams(window.location.search);
        const attractionId = urlParams.get('id');
        const fromTripPlanner = urlParams.get('from') === 'trip-planner';
        let attraction = null;
        let mapInstance = null;
        let isFav = false;

        // --- NEW LOGIC: ADD TO PLAN ---
        document.getElementById('add-to-plan-btn').addEventListener('click', () => {
            if (!Storage.get('travelnow-user')) {
                showToast('Please login to create a plan', 'warning');
                setTimeout(() => window.location.href = 'login.html', 1000);
                return;
            }
            if (!attraction) {
                showToast('Attraction data not ready yet', 'error');
                return;
            }

            if (fromTripPlanner) {
                const saved = Storage.get(TRIP_PLANNER_ITINERARY_KEY) || [];
                const alreadyAdded = Array.isArray(saved) && saved.some(item => String(item._id) === String(attraction._id));
                if (!alreadyAdded) {
                    saved.push({
                        _id: attraction._id,
                        name: attraction.name,
                        governorate: attraction.governorate || '',
                        category: attraction.category || ''
                    });
                    Storage.set(TRIP_PLANNER_ITINERARY_KEY, saved);
                }
                showToast(`${attraction.name} added to your itinerary`, 'success');
                setTimeout(() => { window.location.href = 'trip-planner.html'; }, 800);
                return;
            }

            let draft = Storage.get(DRAFT_POST_KEY) || {
                destination: '',
                extraDestinations: [],
                budget: 5000,
                travelers: 2,
                travelDate: '',
                requiredText: '',
                description: ''
            };

            const attractionGov = attraction.governorate || '';
            const mainDest = draft.destination || '';

            // التحقق من تطابق المحافظة مع الوجهة الأساسية
            if (mainDest && !mainDest.toLowerCase().includes(attractionGov.toLowerCase()) && !attractionGov.toLowerCase().includes(mainDest.toLowerCase())) {
                const confirmAdd = confirm(`This attraction is in ${attractionGov}. Your current plan is for ${mainDest}. \n\nWould you like to add ${attractionGov} as an additional destination?`);
                if (!confirmAdd) return;

                // إضافة المحافظة للوجهات الإضافية لو وافق
                if (!draft.extraDestinations.includes(attractionGov)) {
                    draft.extraDestinations.push(attractionGov);
                }
            }

            if (!draft.destination) {
                draft.destination = attractionGov; // تعيين المحافظة كوجهة أساسية لو كانت فاضية
            }

            // إضافة اسم المعلم لقائمة المتطلبات ليكون واضح في البوست
            if (!draft.description.includes(attraction.name)) {
                draft.description += `\n- Interested in visiting: ${attraction.name}`;
            }

            Storage.set(DRAFT_POST_KEY, draft);
            showToast(`Added ${attraction.name} to your plan!`, 'success');
            setTimeout(() => {
                window.location.href = 'posts.html?action=new-post';
            }, 800);
        });
        // ------------------------------

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, {
                headers: { 'Content-Type': 'application/json', ...Storage.getToken() ? { Authorization: `Bearer ${Storage.getToken()}` } : {}, ...(options.headers || {}) },
                ...options
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Request failed');
            return data;
        }

        function renderAttraction(data) {
            attraction = data;
            const hero = document.getElementById('hero');
            hero.style.backgroundImage = `url('${data.images?.[0] || 'https://images.unsplash.com/photo-1539650116574-8efeb43e2750?w=1200'}')`;

            document.getElementById('attraction-name').textContent = data.name;
            document.getElementById('header-location').textContent = `${data.governorate}, Egypt`;
            document.getElementById('attraction-description').textContent = data.description;

            document.getElementById('stat-category').textContent = data.category;
            document.getElementById('stat-hours').textContent = data.openingHours || '8:00 AM - 5:00 PM';
            document.getElementById('stat-price').textContent = data.prices?.egyptian ? `${data.prices.egyptian} EGP` : 'Free';

            document.getElementById('price-display').innerHTML = `${data.prices?.egyptian || 0} <small style="font-size:1rem;">EGP</small>`;

            document.getElementById('header-rating').innerHTML = '★'.repeat(Math.floor(data.rating || 0)) + '☆'.repeat(5-Math.floor(data.rating || 0));
            document.getElementById('header-reviews').textContent = `(${data.reviews || 0} traveler reviews)`;

            document.getElementById('imagesBtn').href = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(data.name + ' Egypt')}`;

            const lat = data.coordinates?.lat || 26.5;
            const lng = data.coordinates?.lng || 30.5;
            if (mapInstance) mapInstance.remove();
            mapInstance = L.map('map', { scrollWheelZoom: false }).setView([lat, lng], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapInstance);
            L.marker([lat, lng]).addTo(mapInstance).bindPopup(`<b>${data.name}</b>`).openPopup();
        }

        async function loadAttraction() {
            if (!attractionId) return;
            try {
                const data = await fetchJson(`../api/attractions/${attractionId}`);
                renderAttraction(data.attraction);
                loadReviews();
                initFavState();
            } catch (e) { console.error(e); }
        }

        async function loadReviews() {
            const container = document.getElementById('reviews-list');
            const currentUser = Storage.get('travelnow-user');
            try {
                const data = await fetchJson(`../api/reviews/attraction/${attractionId}`);
                const reviews = data.reviews || [];
                container.innerHTML = reviews.length ? reviews.map(r => {
                    const isAuthor = currentUser && String(r.userId?._id || r.userId) === String(currentUser.id);
                    return `
                        <div class="review-card">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <strong style="color: var(--text);">${r.userId?.fullName || 'Traveler'}</strong>
                                    <div style="color: #ffc107;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                                </div>
                                <div class="d-flex gap-2">
                                    ${isAuthor ? `
                                        <button class="btn btn-sm btn-link text-primary p-0" onclick="editReview('${r._id}', ${r.rating}, '${escapeJs(r.comment)}')" title="Edit"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-sm btn-link text-danger p-0" onclick="deleteReview('${r._id}')" title="Delete"><i class="fas fa-trash-alt"></i></button>
                                    ` : ''}
                                    <small class="text-muted" style="font-size: 0.7rem;">${new Date(r.createdAt).toLocaleDateString()}</small>
                                </div>
                            </div>
                            <p class="m-0 text-muted small">${r.comment}</p>
                        </div>
                    `;
                }).join('') : '<p class="text-center text-white py-4 opacity-75">No reviews yet. Be the first to share!</p>';
            } catch (e) { container.innerHTML = ''; }
        }

        function escapeJs(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        window.editReview = (id, rating, comment) => {
            document.getElementById('review-id').value = id;
            document.getElementById('modal-comment').value = comment;
            document.getElementById('reviewModalTitle').innerHTML = '<i class="fas fa-edit me-2"></i> Edit Your Review';
            document.getElementById('review-submit-btn').textContent = 'UPDATE REVIEW';

            // Set stars
            modalRating = rating;
            document.querySelectorAll('#modal-stars i').forEach((item, index) => {
                item.className = index < rating ? 'fas fa-star' : 'far fa-star';
            });

            new bootstrap.Modal(document.getElementById('reviewModal')).show();
        };

        window.deleteReview = async (id) => {
            if (!confirm('Are you sure you want to delete this review?')) return;
            try {
                await fetchJson(`../api/reviews/${id}`, { method: 'DELETE' });
                showToast('Review deleted');
                loadReviews();
            } catch (e) {
                showToast('Delete failed', 'error');
            }
        };
        

        // Review Modal Logic
        let modalRating = 0;
        document.querySelectorAll('#modal-stars i').forEach(star => {
            star.addEventListener('click', () => {
                modalRating = Number(star.dataset.r);
                document.querySelectorAll('#modal-stars i').forEach((item, index) => {
                    item.className = index < modalRating ? 'fas fa-star' : 'far fa-star';
                });
            });
        });

        document.getElementById('review-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!Storage.get('travelnow-user')) return window.location.href = 'login.html';
            if (modalRating < 1) return showToast('Please select a rating', 'warning');

            const id = document.getElementById('review-id').value;
            const btn = document.getElementById('review-submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SAVING...';

            const payload = {
                targetId: attractionId,
                targetType: 'attraction',
                rating: modalRating,
                comment: document.getElementById('modal-comment').value.trim()
            };

            try {
                const url = id ? `../api/reviews/${id}` : '../api/reviews';
                const method = id ? 'PUT' : 'POST';

                const data = await fetchJson(url, { method, body: JSON.stringify(payload) });
                showToast(id ? 'Review updated!' : 'Review submitted!');

                bootstrap.Modal.getInstance(document.getElementById('reviewModal'))?.hide();
                await loadReviews();

                // Reset form
                document.getElementById('review-id').value = '';
                document.getElementById('review-form').reset();
                modalRating = 0;
                document.querySelectorAll('#modal-stars i').forEach(item => item.className = 'far fa-star');
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = id ? 'UPDATE REVIEW' : 'SUBMIT REVIEW';
            }
        };

        // Reset modal on close
        document.getElementById('reviewModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('review-id').value = '';
            document.getElementById('reviewModalTitle').innerHTML = '<i class="fas fa-pen-nib me-2"></i> Write a Review';
            document.getElementById('review-submit-btn').textContent = 'SUBMIT REVIEW';
        });

        // --- Fav Logic ---
        async function initFavState() {
            if (!Storage.get('travelnow-user')) return;
            try {
                const res = await fetchJson(`../api/favorites/check/${attractionId}`);
                isFav = res.isFavorite;
                updateFavBtn();
            } catch (e) {}
        }

        function updateFavBtn() {
            const btn = document.getElementById('favBtn');
            btn.innerHTML = isFav ? '<i class="fas fa-heart text-danger me-2"></i> IN YOUR FAVORITES' : '<i class="far fa-heart me-2"></i> SAVE TO FAVORITES';
            btn.classList.toggle('btn-outline-gold', !isFav);
            btn.classList.toggle('btn-outline-danger', isFav);
        }

        document.getElementById('favBtn').onclick = async () => {
            if (!Storage.get('travelnow-user')) return window.location.href = 'login.html';
            try {
                const method = isFav ? 'DELETE' : 'POST';
                const url = isFav ? `../api/favorites/by-attraction/${attractionId}` : `../api/favorites`;
                await fetchJson(url, { method, body: isFav ? null : JSON.stringify({ attractionId }) });
                isFav = !isFav;
                updateFavBtn();
                showToast(isFav ? 'Added to favorites!' : 'Removed from favorites');
            } catch (e) {}
        };

        initTravelNav({ activePage: 'attractions' });
        loadAttraction();
    </script>
</body>
</html>
