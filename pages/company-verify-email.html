<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <style>
        .otp-inputs { display:flex; gap:10px; justify-content:center; margin:24px 0; }
        .otp-digit {
            width:56px; height:64px; text-align:center;
            font-size:1.8rem; font-weight:700;
            background:rgba(255,255,255,0.08); border:2px solid rgba(212,175,55,0.3);
            border-radius:14px; color:#fff; outline:none;
            transition:border-color 0.2s, box-shadow 0.2s;
            caret-color: #d4af37;
        }
        .otp-digit:focus  { border-color:#d4af37; box-shadow:0 0 0 4px rgba(212,175,55,0.15); }
        .otp-digit.filled { border-color:rgba(212,175,55,0.6); }
        .cooldown-msg { font-size:0.82rem; color:rgba(255,255,255,0.55); text-align:center; margin-top:10px; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-envelope-open-text" style="color:#d4af37;"></i>
                <h2>VERIFY YOUR EMAIL</h2>
                <p id="email-hint" style="color:rgba(255,255,255,0.7);font-size:0.9rem;">
                    Enter the 6-digit code sent to your email
                </p>
            </div>

            <div class="otp-inputs" id="otp-inputs">
                <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
            </div>

            <div id="otp-error" style="color:#ff6b7a;text-align:center;font-size:0.85rem;margin-bottom:12px;display:none;"></div>

            <button class="btn btn-gold auth-submit w-100" id="verify-btn" onclick="verifyCode()">
                <i class="fas fa-check me-1"></i> Verify Email
            </button>

            <div class="cooldown-msg mt-3">
                Didn't receive it?
                <button id="resend-btn" class="btn btn-link p-0 auth-link" onclick="resendCode()" disabled style="font-size:0.82rem;">
                    Resend in <span id="cooldown-timer">60</span>s
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script>
    // Get email from URL
    const params        = new URLSearchParams(window.location.search);
    const email         = params.get('email') || '';
    let cooldownInterval = null;

    if (!email) {
        // No email passed — redirect back to registration
        window.location.href = 'company-register.html';
    } else {
        document.getElementById('email-hint').textContent =
            `Enter the 6-digit code sent to: ${email}`;
    }

    // ── Wire OTP digit inputs ──
    const otpWrap = document.getElementById('otp-inputs');
    otpWrap.addEventListener('input', e => {
        const d = e.target;
        if (d.value.length === 1) {
            d.classList.add('filled');
            if (d.nextElementSibling) d.nextElementSibling.focus();
            if ([...otpWrap.querySelectorAll('.otp-digit')].every(x => x.value.length === 1)) {
                verifyCode();
            }
        } else { d.classList.remove('filled'); }
    });
    otpWrap.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && e.target.previousElementSibling) {
            e.target.previousElementSibling.value = '';
            e.target.previousElementSibling.classList.remove('filled');
            e.target.previousElementSibling.focus();
        }
    });

    // Focus first digit on load
    document.querySelectorAll('.otp-digit')[0]?.focus();
    startCooldown(60);

    // ── Verify code ──
    async function verifyCode() {
        const code = [...otpWrap.querySelectorAll('.otp-digit')].map(d => d.value).join('');
        if (code.length < 6) return showToast('Enter the full 6-digit code', 'warning');

        const btn    = document.getElementById('verify-btn');
        const errEl  = document.getElementById('otp-error');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Verifying…';
        errEl.style.display = 'none';

        try {
            const res  = await fetch(`${API_BASE}/companies/verify-email`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code })
            });
            const data = await res.json();

            if (!res.ok) {
                errEl.textContent = data.message || 'Incorrect code. Please try again.';
                errEl.style.display = 'block';
                [...otpWrap.querySelectorAll('.otp-digit')].forEach(d => { d.value = ''; d.classList.remove('filled'); });
                otpWrap.querySelectorAll('.otp-digit')[0]?.focus();
                return;
            }

            // Email verified — redirect to waiting page
            clearInterval(cooldownInterval);
            showToast('Email verified! Please wait for admin approval.', 'success');
            setTimeout(() => {
                window.location.href = `company-waiting.html?email=${encodeURIComponent(email)}`;
            }, 1200);

        } catch (err) {
            errEl.textContent = 'Connection error. Please try again.';
            errEl.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check me-1"></i> Verify Email';
        }
    }

    // ── Resend code ──
    async function resendCode() {
        const btn = document.getElementById('resend-btn');
        btn.disabled = true;
        try {
            const res  = await fetch(`${API_BASE}/companies/verify-email/resend`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message);
            showToast('New verification code sent to your email', 'success');
            [...otpWrap.querySelectorAll('.otp-digit')].forEach(d => { d.value = ''; d.classList.remove('filled'); });
            otpWrap.querySelectorAll('.otp-digit')[0]?.focus();
            startCooldown(60);
        } catch (err) {
            showToast(err.message || 'Failed to resend. Try again.', 'error');
            btn.disabled = false;
        }
    }

    // ── Cooldown timer ──
    function startCooldown(seconds) {
        clearInterval(cooldownInterval);
        const btn = document.getElementById('resend-btn');
        btn.disabled = true;
        let rem = seconds;
        btn.innerHTML = `Resend in <span id="cooldown-timer">${rem}</span>s`;
        cooldownInterval = setInterval(() => {
            rem--;
            const t = document.getElementById('cooldown-timer');
            if (t) t.textContent = rem;
            if (rem <= 0) {
                clearInterval(cooldownInterval);
                btn.innerHTML = 'Resend code';
                btn.disabled  = false;
            }
        }, 1000);
    }
    </script>
</body>
</html>
