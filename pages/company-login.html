<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Login - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
</head>
<body class="auth-page">
    <div id="tn-navbar" data-variant="minimal"></div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-building"></i>
                <h2>COMPANY LOGIN</h2>
                <p>Approved partners only</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="company@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-gold auth-submit" id="login-submit">
                    <i class="fas fa-sign-in-alt"></i> LOGIN
                </button>
                    <p class="text-center mt-3" style="color:var(--text-muted);">
                        Don't have an account? <a href="register.html" class="auth-link" style="color:#d4af37; text-decoration:none;">Register here</a>
                        <br>
                        <span style="font-size: 0.9rem;">Are you a partner? <a href="company-login.html" class="auth-link" style="color:#d4af37; text-decoration:none; font-weight:600;">Company Login</a></span>
                    </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script>
    // Override handleLogin to show meaningful messages for pending/rejected companies
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email    = this.email.value.trim();
        const password = this.password.value;
        const btn      = document.getElementById('login-submit');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Logging in…';

        try {
            const res  = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (!res.ok) {
                // Check if it's a pending/rejected company
                if (data.status === 'pending') {
                    showStatusCard('pending', data.companyName || 'Your company');
                    return;
                }
                if (data.status === 'rejected') {
                    showStatusCard('rejected', data.companyName || 'Your company', data.reason || '');
                    return;
                }
                throw new Error(data.message || 'Login failed');
            }

            // Success — store and redirect
            Storage.set('travelnow-user', data.user);
            Storage.setToken(data.token);
            window.location.href = 'company-dashboard.html';

        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> LOGIN';
        }
    });

    function showStatusCard(status, companyName, reason) {
        const form = document.querySelector('.auth-card');
        if (status === 'pending') {
            form.innerHTML = `
                <div style="text-align:center;padding:20px 0;">
                    <div style="font-size:3.5rem;margin-bottom:12px;">⏳</div>
                    <h4 style="color:#d4af37;margin-bottom:8px;">Application Under Review</h4>
                    <p style="color:rgba(255,255,255,0.75);line-height:1.7;margin-bottom:16px;">
                        <strong style="color:#d4af37;">${companyName}</strong> is still being reviewed by our admin team.
                        You'll receive a WhatsApp notification once approved.
                    </p>
                    <div style="background:rgba(255,193,7,0.1);border:1px solid rgba(255,193,7,0.3);border-radius:12px;padding:14px 20px;display:inline-block;margin-bottom:20px;">
                        <span style="color:#ffc107;font-weight:700;font-size:1rem;"><i class="fas fa-clock me-2"></i>WAITING FOR APPROVAL</span>
                    </div>
                    <br>
                    <a href="company-register.html" class="btn btn-outline-warning btn-sm px-4">
                        <i class="fas fa-arrow-left me-1"></i> Back to Registration
                    </a>
                </div>`;
        } else if (status === 'rejected') {
            form.innerHTML = `
                <div style="text-align:center;padding:20px 0;">
                    <div style="font-size:3.5rem;margin-bottom:12px;">❌</div>
                    <h4 style="color:#ff4d4d;margin-bottom:8px;">Application Not Approved</h4>
                    <p style="color:rgba(255,255,255,0.75);line-height:1.7;margin-bottom:16px;">
                        Unfortunately, <strong style="color:#d4af37;">${companyName}</strong>'s application was not approved.
                        ${reason ? `<br><span style="color:rgba(255,255,255,0.55);font-size:0.85rem;">Reason: ${reason}</span>` : ''}
                    </p>
                    <div style="background:rgba(220,53,69,0.1);border:1px solid rgba(220,53,69,0.3);border-radius:12px;padding:14px 20px;display:inline-block;margin-bottom:20px;">
                        <span style="color:#ff6b7a;font-weight:700;font-size:1rem;"><i class="fas fa-times-circle me-2"></i>NOT APPROVED</span>
                    </div>
                    <br>
                    <a href="company-register.html" class="btn btn-gold btn-sm px-4">
                        <i class="fas fa-redo me-1"></i> Apply Again
                    </a>
                </div>`;
        }
    }

    </script>
</body>
</html>
