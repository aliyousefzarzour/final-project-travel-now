<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <style>
        .otp-inputs { display:flex; gap:10px; justify-content:center; margin:20px 0; }
        .otp-digit {
            width:52px; height:60px; text-align:center;
            font-size:1.6rem; font-weight:700;
            background:rgba(255,255,255,0.08); border:2px solid rgba(212,175,55,0.3);
            border-radius:14px; color:#fff; outline:none;
            transition:border-color 0.2s, box-shadow 0.2s;
        }
        .otp-digit:focus { border-color:#d4af37; box-shadow:0 0 0 4px rgba(212,175,55,0.15); }
        .otp-digit.filled { border-color:rgba(212,175,55,0.6); }
        .step-wrap { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; }
        .step-dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.2); transition:background 0.3s; }
        .step-dot.active { background:#d4af37; }
        .step-dot.done   { background:rgba(40,199,111,0.8); }
        .cooldown-msg { font-size:0.82rem; color:rgba(255,255,255,0.55); text-align:center; margin-top:8px; }
        .pwd-wrap { position:relative; }
        .pwd-toggle {
            position:absolute; right:12px; top:50%; transform:translateY(-50%);
            background:transparent; border:none; color:#d4af37;
            width:32px; height:32px; border-radius:50%; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            z-index:2;
        }
        .pwd-wrap .form-control { padding-right: 48px; }
    </style>
</head>
<body class="auth-page">
    <div id="tn-navbar" data-variant="minimal"></div>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">
                <i class="fas fa-envelope" id="step-icon" style="color:#d4af37;"></i>
                <h2 style="font-weight:700;">RESET PASSWORD</h2>
                <p class="text-muted small" id="step-subtitle">Enter your email to receive a reset code</p>
            </div>

            <div class="step-wrap">
                <div class="step-dot active" id="dot-1"></div>
                <div class="step-dot" id="dot-2"></div>
                <div class="step-dot" id="dot-3"></div>
            </div>

            <!-- ══ STEP 1: Enter email ══ -->
            <div id="step-1">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope me-1"></i> Email Address</label>
                    <input type="email" class="form-control" id="reset-email" placeholder="your@email.com" autofocus>
                </div>
                <button class="btn btn-gold auth-submit w-100" onclick="sendResetCode()" id="send-btn">
                    <i class="fas fa-paper-plane me-1"></i> Send Reset Code
                </button>
                <p class="text-center mt-3 mb-0" style="color:var(--text-muted);">
                    Remember your password? <a href="login.html" class="auth-link">Login</a>
                </p>
            </div>

            <!-- ══ STEP 2: Enter code ══ -->
            <div id="step-2" style="display:none">
                <p class="text-center mb-1" style="color:rgba(255,255,255,0.75);">
                    Code sent to <strong id="reset-email-display" style="color:#d4af37"></strong>
                </p>
                <div class="otp-inputs" id="otp-inputs">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                </div>
                <div id="otp-error" style="color:#ff6b7a;text-align:center;font-size:0.85rem;margin-top:4px;display:none;"></div>
                <button class="btn btn-gold w-100 mt-2" id="verify-btn" onclick="verifyResetCode()">
                    <i class="fas fa-check me-1"></i> Verify Code
                </button>
                <div class="cooldown-msg mt-3">
                    <button id="resend-btn" class="btn btn-link p-0 auth-link" onclick="sendResetCode(true)" disabled style="font-size:0.82rem;">
                        Resend in <span id="cooldown-timer">60</span>s
                    </button>
                </div>
                <button class="btn btn-link d-block mx-auto mt-2" style="color:rgba(255,255,255,0.4);font-size:0.78rem;" onclick="goToStep(1)">
                    <i class="fas fa-arrow-left me-1"></i> Change email
                </button>
            </div>

            <!-- ══ STEP 3: New password ══ -->
            <div id="step-3" style="display:none">
                <div class="mb-3 pwd-wrap">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control pe-5" id="new-password" placeholder="At least 6 characters" minlength="6">
                    <button type="button" class="pwd-toggle" onclick="togglePwd('new-password', this)"><i class="fas fa-eye"></i></button>
                </div>
                <div class="mb-4 pwd-wrap">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control pe-5" id="confirm-password" placeholder="Repeat password">
                    <button type="button" class="pwd-toggle" onclick="togglePwd('confirm-password', this)"><i class="fas fa-eye"></i></button>
                </div>
                <button class="btn btn-gold auth-submit w-100" onclick="saveNewPassword()" id="save-btn">
                    <i class="fas fa-lock me-1"></i> Save New Password
                </button>
            </div>

        </div>
        <a href="login.html" class="back-link text-center d-block mt-4">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script>
    let resetEmail       = '';
    let verifiedOtp      = '';
    let cooldownInterval = null;

    const subtitles = [
        'Enter your email to receive a reset code',
        'Enter the 6-digit code sent to your email',
        'Choose a new password'
    ];

    function goToStep(n) {
        [1, 2, 3].forEach(i => {
            document.getElementById(`step-${i}`).style.display = i === n ? '' : 'none';
            const dot = document.getElementById(`dot-${i}`);
            if (i < n)        dot.className = 'step-dot done';
            else if (i === n) dot.className = 'step-dot active';
            else              dot.className = 'step-dot';
        });
        document.getElementById('step-subtitle').textContent = subtitles[n - 1];
        if (n === 1) clearInterval(cooldownInterval);
    }

    // ── STEP 1: Send email reset code ──
    async function sendResetCode(isResend = false) {
        const emailVal = isResend ? resetEmail : document.getElementById('reset-email').value.trim();
        if (!emailVal) return showToast('Please enter your email', 'error');

        const btn = isResend ? document.getElementById('resend-btn') : document.getElementById('send-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>';

        try {
            const res  = await fetch(`${API_BASE}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailVal })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Failed to send code');

            resetEmail = emailVal;
            document.getElementById('reset-email-display').textContent = emailVal;

            if (!isResend) goToStep(2);
            document.querySelectorAll('.otp-digit')[0]?.focus();
            startCooldown(60);
            if (isResend) showToast('New reset code sent to your email', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = isResend ? 'Resend code' : '<i class="fas fa-paper-plane me-1"></i> Send Reset Code';
        }
    }

    // ── OTP digit inputs ──
    document.getElementById('otp-inputs').addEventListener('input', e => {
        const d = e.target;
        if (d.value.length === 1) {
            d.classList.add('filled');
            if (d.nextElementSibling) d.nextElementSibling.focus();
            if ([...document.querySelectorAll('.otp-digit')].every(x => x.value.length === 1)) verifyResetCode();
        } else { d.classList.remove('filled'); }
    });
    document.getElementById('otp-inputs').addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && e.target.previousElementSibling) {
            e.target.previousElementSibling.value = '';
            e.target.previousElementSibling.classList.remove('filled');
            e.target.previousElementSibling.focus();
        }
    });

    // ── STEP 2: Verify code ──
    async function verifyResetCode() {
        const code = [...document.querySelectorAll('.otp-digit')].map(d => d.value).join('');
        if (code.length < 6) return showToast('Enter the full 6-digit code', 'warning');

        const btn   = document.getElementById('verify-btn');
        const errEl = document.getElementById('otp-error');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Verifying…';
        errEl.style.display = 'none';

        try {
            // Verify by attempting reset with placeholder — if OTP invalid backend returns error
            const res  = await fetch(`${API_BASE}/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail, otp: code, newPassword: '__verify_only__' })
            });
            const data = await res.json();

            // If error is about password length/content (not OTP), the OTP was valid
            if (res.ok || (data.message && (
                data.message.toLowerCase().includes('password') ||
                data.message.toLowerCase().includes('characters')
            ))) {
                verifiedOtp = code;
                clearInterval(cooldownInterval);
                goToStep(3);
                document.getElementById('new-password').focus();
            } else {
                throw new Error(data.message || 'Invalid code');
            }
        } catch (err) {
            errEl.textContent = err.message;
            errEl.style.display = 'block';
            document.querySelectorAll('.otp-digit').forEach(d => { d.value = ''; d.classList.remove('filled'); });
            document.querySelectorAll('.otp-digit')[0]?.focus();
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check me-1"></i> Verify Code';
        }
    }

    // ── STEP 3: Save new password ──
    async function saveNewPassword() {
        const pwd     = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (pwd.length < 6) return showToast('Password must be at least 6 characters', 'error');
        if (pwd !== confirm) return showToast('Passwords do not match', 'error');

        const btn = document.getElementById('save-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Saving…';

        try {
            const res  = await fetch(`${API_BASE}/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail, otp: verifiedOtp, newPassword: pwd })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message);
            showToast('Password reset successfully! Please login.', 'success');
            setTimeout(() => window.location.href = 'login.html', 1800);
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-lock me-1"></i> Save New Password';
        }
    }

    // ── Cooldown timer ──
    function startCooldown(seconds) {
        clearInterval(cooldownInterval);
        const btn = document.getElementById('resend-btn');
        if (!btn) return;
        btn.disabled = true;
        let rem = seconds;
        btn.innerHTML = `Resend in <span id="cooldown-timer">${rem}</span>s`;
        cooldownInterval = setInterval(() => {
            rem--;
            const t = document.getElementById('cooldown-timer');
            if (t) t.textContent = rem;
            if (rem <= 0) {
                clearInterval(cooldownInterval);
                btn.innerHTML = 'Resend code';
                btn.disabled  = false;
            }
        }, 1000);
    }

    // ── Password visibility toggle ──
    function togglePwd(id, btn) {
        const input = document.getElementById(id);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
        else { input.type = 'password'; icon.className = 'fas fa-eye'; }
    }

    // Enter key on email input
    document.getElementById('reset-email').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendResetCode();
    });
    </script>
</body>
</html>
