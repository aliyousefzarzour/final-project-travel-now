<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <style>
        /* OTP digit inputs */
        .otp-inputs { display:flex; gap:10px; justify-content:center; margin:20px 0; }
        .otp-digit {
            width:52px; height:60px; text-align:center;
            font-size:1.6rem; font-weight:700;
            background:rgba(255,255,255,0.08); border:2px solid rgba(212,175,55,0.3);
            border-radius:14px; color:#fff; outline:none;
            transition:border-color 0.2s, box-shadow 0.2s;
        }
        .otp-digit:focus { border-color:#d4af37; box-shadow:0 0 0 4px rgba(212,175,55,0.15); }
        .otp-digit.filled { border-color:rgba(212,175,55,0.6); }

        /* Step dots */
        .step-wrap { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; }
        .step-dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.2); transition:background 0.3s; }
        .step-dot.active { background:#d4af37; }
        .step-dot.done   { background:rgba(40,199,111,0.8); }

        /* Account confirm box */
        .account-confirm {
            background:rgba(212,175,55,0.08);
            border:1px solid rgba(212,175,55,0.25);
            border-radius:16px; padding:20px; text-align:center; margin:16px 0;
        }
        .account-name {
            font-family:'Cinzel',serif; font-size:1.3rem;
            color:#d4af37; font-weight:700; margin:8px 0 4px;
        }

        /* Cooldown */
        .cooldown-msg { font-size:0.82rem; color:rgba(255,255,255,0.55); text-align:center; margin-top:8px; }

        /* Password visibility toggle */
        .pwd-wrap { position:relative; }
        .pwd-toggle {
            position:absolute; right:14px; top:50%; transform:translateY(-50%);
            background:rgba(212,175,55,0.12); border:none; color:#d4af37;
            width:36px; height:36px; border-radius:50%; cursor:pointer;
            display:flex; align-items:center; justify-content:center; transition:background 0.2s;
        }
        .pwd-toggle:hover { background:rgba(212,175,55,0.22); }
    </style>
</head>
<body class="auth-page">
    <div id="tn-navbar" data-variant="minimal"></div>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">
                <i class="fab fa-whatsapp" id="step-icon" style="color:#25d366;"></i>
                <h2 class="font-cinzel" style="font-weight:700;">RESET PASSWORD</h2>
                <p class="text-muted small" id="step-subtitle">Enter your WhatsApp number linked to your account</p>
            </div>

            <!-- Step dots (4 steps) -->
            <div class="step-wrap">
                <div class="step-dot active" id="dot-1"></div>
                <div class="step-dot" id="dot-2"></div>
                <div class="step-dot" id="dot-3"></div>
                <div class="step-dot" id="dot-4"></div>
            </div>

            <!-- ══ STEP 1: Enter phone ══ -->
            <div id="step-1">
                <div class="mb-3">
                    <label class="form-label"><i class="fab fa-whatsapp" style="color:#25d366"></i> WhatsApp Number</label>
                    <input type="tel" class="form-control" id="reset-phone"
                        placeholder="+20 1xx xxx xxxx" autofocus>
                </div>
                <button class="btn btn-gold auth-submit w-100" onclick="lookupPhone()" id="lookup-btn">
                    <i class="fas fa-search me-1"></i> Find My Account
                </button>
                <p class="text-center mt-3 mb-0" style="color:var(--text-muted);">
                    Remember your password? <a href="login.html" class="auth-link">Login</a>
                </p>
            </div>

            <!-- ══ STEP 2: Confirm account ══ -->
            <div id="step-2" style="display:none">
                <div class="account-confirm">
                    <i class="fas fa-user-circle fa-2x" style="color:#d4af37;"></i>
                    <div class="account-name" id="confirm-name"></div>
                    <small style="color:rgba(255,255,255,0.6);">Is this your account?</small>
                </div>
                <div class="d-flex gap-3 mt-3">
                    <button class="btn btn-gold flex-grow-1" onclick="confirmAccount()">
                        <i class="fas fa-check me-1"></i> Yes, Send OTP
                    </button>
                    <button class="btn btn-outline-secondary flex-grow-1" onclick="goToStep(1)">
                        <i class="fas fa-times me-1"></i> Not Me
                    </button>
                </div>
            </div>

            <!-- ══ STEP 3: Enter OTP ══ -->
            <div id="step-3" style="display:none">
                <p class="text-center mb-1" style="color:rgba(255,255,255,0.75);">
                    Code sent to <strong id="otp-phone-display" style="color:#d4af37"></strong>
                </p>

                <div class="otp-inputs" id="otp-inputs">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
                </div>

                <div id="otp-error" style="color:#ff6b7a;text-align:center;font-size:0.85rem;margin-top:4px;display:none;"></div>

                <button class="btn btn-gold w-100 mt-2" id="verify-otp-btn" onclick="verifyOtp()">
                    <i class="fas fa-check me-1"></i> Verify Code
                </button>

                <div class="cooldown-msg mt-3">
                    <button id="resend-btn" class="btn btn-link p-0 auth-link" onclick="resendOtp()" disabled style="font-size:0.82rem;">
                        Resend in <span id="cooldown-timer">60</span>s
                    </button>
                </div>

                <button class="btn btn-link d-block mx-auto mt-2" style="color:rgba(255,255,255,0.4);font-size:0.78rem;" onclick="goToStep(1)">
                    <i class="fas fa-arrow-left me-1"></i> Use different number
                </button>
            </div>

            <!-- ══ STEP 4: New password ══ -->
            <div id="step-4" style="display:none">
                <div class="mb-3 pwd-wrap">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control pe-5" id="new-password" placeholder="At least 6 characters" minlength="6">
                    <button type="button" class="pwd-toggle" onclick="togglePwd('new-password', this)"><i class="fas fa-eye"></i></button>
                </div>
                <div class="mb-4 pwd-wrap">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control pe-5" id="confirm-password" placeholder="Repeat password">
                    <button type="button" class="pwd-toggle" onclick="togglePwd('confirm-password', this)"><i class="fas fa-eye"></i></button>
                </div>
                <button class="btn btn-gold auth-submit w-100" onclick="setNewPassword()" id="save-pwd-btn">
                    <i class="fas fa-lock me-1"></i> Save New Password
                </button>
            </div>

        </div>

        <a href="login.html" class="back-link text-center d-block mt-4">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script>
    let resetPhone = '';
    let otpVerified = false;
    let cooldownInterval = null;

    const subtitles = [
        'Enter your WhatsApp number linked to your account',
        'Confirm your identity',
        'Enter the 6-digit code sent to your WhatsApp',
        'Choose a new password'
    ];
    const icons = ['fab fa-whatsapp', 'fas fa-user-circle', 'fas fa-comment-dots', 'fas fa-lock'];

    function goToStep(n) {
        [1, 2, 3, 4].forEach(i => {
            document.getElementById(`step-${i}`).style.display = i === n ? '' : 'none';
            const dot = document.getElementById(`dot-${i}`);
            if (i < n)       dot.className = 'step-dot done';
            else if (i === n) dot.className = 'step-dot active';
            else              dot.className = 'step-dot';
        });
        document.getElementById('step-subtitle').textContent = subtitles[n - 1];
        document.getElementById('step-icon').className = icons[n - 1];
        if (n === 1) { clearInterval(cooldownInterval); }
    }

    // ── STEP 1: Look up phone ──
    async function lookupPhone() {
        const phone = document.getElementById('reset-phone').value.trim();
        if (!phone) return showToast('Please enter your WhatsApp number', 'error');

        const btn = document.getElementById('lookup-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Searching…';

        try {
            const res  = await fetch(`${API_BASE}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const data = await res.json();

            if (!res.ok || !data.found) {
                showToast(data.message || 'No account found with this number', 'error');
                return;
            }

            resetPhone = data.phone || phone;
            document.getElementById('confirm-name').textContent = data.maskedName;
            goToStep(2);
        } catch (_) {
            showToast('Connection error. Please try again.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-search me-1"></i> Find My Account';
        }
    }

    // ── STEP 2: Confirm → send OTP ──
    async function confirmAccount() {
        const btn = document.querySelector('#step-2 .btn-gold');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Sending…';

        try {
            const res  = await fetch(`${API_BASE}/auth/forgot-password/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: resetPhone })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message);

            document.getElementById('otp-phone-display').textContent = resetPhone;
            goToStep(3);
            startCooldown(data.cooldown || 60);
            document.querySelectorAll('.otp-digit')[0]?.focus();
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check me-1"></i> Yes, Send OTP';
        }
    }

    // ── OTP digit keyboard ──
    document.getElementById('otp-inputs').addEventListener('input', e => {
        const d = e.target;
        if (d.value.length === 1) {
            d.classList.add('filled');
            const next = d.nextElementSibling;
            if (next) next.focus();
            const all = [...document.querySelectorAll('.otp-digit')];
            if (all.every(x => x.value.length === 1)) verifyOtp();
        } else {
            d.classList.remove('filled');
        }
    });
    document.getElementById('otp-inputs').addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value) {
            const prev = e.target.previousElementSibling;
            if (prev) { prev.value = ''; prev.classList.remove('filled'); prev.focus(); }
        }
    });

    // ── STEP 3: Verify OTP ──
    async function verifyOtp() {
        const digits = [...document.querySelectorAll('.otp-digit')].map(d => d.value).join('');
        if (digits.length < 6) return showToast('Enter the full 6-digit code', 'warning');

        const btn = document.getElementById('verify-otp-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Verifying…';
        document.getElementById('otp-error').style.display = 'none';

        try {
            const res  = await fetch(`${API_BASE}/auth/whatsapp-otp/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: resetPhone, otp: digits })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message);

            otpVerified = true;
            clearInterval(cooldownInterval);
            goToStep(4);
        } catch (err) {
            const errEl = document.getElementById('otp-error');
            errEl.textContent = err.message;
            errEl.style.display = 'block';
            document.querySelectorAll('.otp-digit').forEach(d => { d.value = ''; d.classList.remove('filled'); });
            document.querySelectorAll('.otp-digit')[0]?.focus();
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check me-1"></i> Verify Code';
        }
    }

    // ── Resend OTP ──
    async function resendOtp() {
        const btn = document.getElementById('resend-btn');
        btn.disabled = true;
        try {
            const res  = await fetch(`${API_BASE}/auth/forgot-password/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: resetPhone })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message);
            showToast('New code sent to your WhatsApp', 'success');
            document.querySelectorAll('.otp-digit').forEach(d => { d.value = ''; d.classList.remove('filled'); });
            document.querySelectorAll('.otp-digit')[0]?.focus();
            startCooldown(data.cooldown || 60);
        } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
        }
    }

    // ── Cooldown timer ──
    function startCooldown(seconds) {
        clearInterval(cooldownInterval);
        const btn   = document.getElementById('resend-btn');
        const timer = document.getElementById('cooldown-timer');
        btn.disabled = true;
        let rem = seconds;
        if (timer) timer.textContent = rem;
        cooldownInterval = setInterval(() => {
            rem--;
            const t = document.getElementById('cooldown-timer');
            if (t) t.textContent = rem;
            if (rem <= 0) {
                clearInterval(cooldownInterval);
                btn.innerHTML = 'Resend OTP';
                btn.disabled = false;
            }
        }, 1000);
    }

    // ── STEP 4: Save new password ──
    async function setNewPassword() {
        const pwd     = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (pwd.length < 6) return showToast('Password must be at least 6 characters', 'error');
        if (pwd !== confirm) return showToast('Passwords do not match', 'error');

        const btn = document.getElementById('save-pwd-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Saving…';

        try {
            const res  = await fetch(`${API_BASE}/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: resetPhone, otp: 'verified', newPassword: pwd })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message);
            showToast('Password reset successfully! Please login.', 'success');
            setTimeout(() => window.location.href = 'login.html', 1800);
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-lock me-1"></i> Save New Password';
        }
    }

    // ── Password visibility toggle ──
    function togglePwd(id, btn) {
        const input = document.getElementById(id);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    // Enter key on phone input
    document.getElementById('reset-phone').addEventListener('keydown', e => {
        if (e.key === 'Enter') lookupPhone();
    });
    </script>
</body>
</html>
