<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
    <div id="tn-navbar" data-variant="minimal"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-pyramid"></i>
                <h2>TRAVELNOW</h2>
                <p>Welcome back, traveler</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="your@email.com" required>
                </div>

                <div class="mb-3 position-relative">
                    <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                    <input id="password-field" type="password" class="form-control" name="password" placeholder="Enter your password" required>
                    <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="d-flex justify-content-between align-items-center ">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label" for="remember" style="color:#d4af37">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="auth-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-gold auth-submit mb-3" id="login-submit">
                    <i class="fas fa-sign-in-alt"></i> LOGIN
                </button>
                <p class="text-center " style="color:#ccc">
                    Don't have an account?
                    <a href="register.html" class="auth-link">Register Now</a>
                </p>
                <div class="auth-divider"><span>OR</span></div>



            </form>
<!-- Google Sign-In: hidden official loader + custom styled button -->
                <div id="g_id_onload"
                    data-client_id="472844156998-o2uftp7651tsbfdo00hv07h95vlou5vb.apps.googleusercontent.com"
                    data-context="signin"
                    data-ux_mode="popup"
                    data-callback="handleGoogleLogin"
                    data-auto_prompt="false"
                    style="display:none">
                </div>

                <div class="d-flex justify-content-center mt-4 w-100">
                    <button type="button" id="google-signin-btn" class="tn-google-btn" onclick="triggerGoogleSignIn()">
                        <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                            <path fill="none" d="M0 0h48v48H0z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>
                </div>
        </div>

        <a href="user-type.html" class="back-link text-center d-block mt-3">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <style>
        .password-toggle-btn {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            border: none;
            background: rgba(212, 175, 55, 0.12);
            color: #d4af37;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }
        .password-toggle-btn:hover {
            background: rgba(212, 175, 55, 0.22);
            transform: translateY(-50%) scale(1.05);
        }
        .password-toggle-btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 175, 175, 0.16);
        }
        .password-toggle-btn {
            top: 68%;
            right: 14px;
            width: 40px;
            height: 40px;
            font-size: 0.95rem;
            border-radius: 50%;
            transform: translateY(-50%);
        }
        .auth-page .form-control {
            padding-right: 64px;
        }

        /* ── Custom Google Button ── */
        .tn-google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            padding: 12px 24px;
            border-radius: 50px;
            border: 1.5px solid rgba(212, 175, 55, 0.35);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.25s ease, border-color 0.25s ease,
                        box-shadow 0.25s ease, transform 0.2s ease;
        }
        .tn-google-btn:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.7);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.18);
            transform: translateY(-2px);
        }
        .tn-google-btn:active {
            transform: translateY(0);
        }
        /* Light mode */
        body:not(.dark-mode) .tn-google-btn {
            background: #ffffff;
            border-color: #dadce0;
            color: #3c4043;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        body:not(.dark-mode) .tn-google-btn:hover {
            background: #f8f9fa;
            border-color: #d4af37;
            box-shadow: 0 4px 16px rgba(212,175,55,0.2);
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Password toggle
            const pwdField = document.getElementById('password-field');
            const toggleBtn = document.getElementById('toggle-password');
            if (pwdField && toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const isPassword = pwdField.type === 'password';
                    pwdField.type = isPassword ? 'text' : 'password';
                    toggleBtn.innerHTML = isPassword
                        ? '<i class="fas fa-eye-slash"></i>'
                        : '<i class="fas fa-eye"></i>';
                });
            }

            // Handle redirect-based Google OAuth response (id_token in URL hash)
            const hash = window.location.hash;
            if (hash && hash.includes('id_token=')) {
                const params = new URLSearchParams(hash.slice(1));
                const idToken = params.get('id_token');
                if (idToken) {
                    // Clear the hash from URL
                    history.replaceState(null, '', window.location.pathname);
                    // Process the token same as handleGoogleLogin
                    handleGoogleLogin({ credential: idToken });
                }
            }
        });

        // Google Sign-In trigger
        function triggerGoogleSignIn() {
            const btn = document.getElementById('google-signin-btn');
            const GOOGLE_ICON = `<svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>`;

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = GOOGLE_ICON + '<span>Connecting...</span>';
            }

            const reset = () => {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = GOOGLE_ICON + '<span>Continue with Google</span>';
                }
            };

            if (typeof google === 'undefined' || !google.accounts) {
                showToast('Google Sign-In is loading. Please try again in a moment.', 'warning');
                reset();
                return;
            }

            // Use oauth2 token client — opens a proper Google account picker popup
            const client = google.accounts.oauth2.initTokenClient({
                client_id: '472844156998-o2uftp7651tsbfdo00hv07h95vlou5vb.apps.googleusercontent.com',
                scope: 'openid email profile',
                callback: async (tokenResponse) => {
                    if (tokenResponse.error) {
                        showToast('Google Sign-In was cancelled.', 'warning');
                        reset();
                        return;
                    }
                    // Exchange access token for user info then call backend
                    try {
                        const userInfoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { 'Authorization': 'Bearer ' + tokenResponse.access_token }
                        });
                        const userInfo = await userInfoRes.json();

                        // Create a pseudo credential object that our backend can use
                        // We'll send the access token and user info to our own endpoint
                        const res = await fetch(`${API_BASE}/auth/google-access-token`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                access_token: tokenResponse.access_token,
                                email: userInfo.email,
                                name: userInfo.name,
                                picture: userInfo.picture,
                                sub: userInfo.sub
                            })
                        });
                        const data = await res.json();
                        if (res.ok && data.token) {
                            Storage.set('travelnow-user', { ...data.user, token: data.token });
                            Storage.setToken(data.token);
                            showToast(`Welcome, ${data.user.fullName || data.user.name}! 👋`);
                            setTimeout(() => {
                                const role = data.user.role || 'tourist';
                                if (role === 'admin') window.location.href = '../admin/admin.html';
                                else if (role === 'company') window.location.href = '../pages/company-dashboard.html';
                                else window.location.href = '../pages/dashboard.html';
                            }, 900);
                        } else {
                            // Fallback: use local demo mode
                            const localUser = {
                                fullName: userInfo.name,
                                username: userInfo.email.split('@')[0],
                                email: userInfo.email,
                                role: 'tourist',
                                profilePic: userInfo.picture,
                                token: tokenResponse.access_token
                            };
                            Storage.set('travelnow-user', localUser);
                            Storage.setToken(tokenResponse.access_token);
                            showToast(`Welcome, ${userInfo.name}!`);
                            setTimeout(() => window.location.href = '../pages/dashboard.html', 900);
                        }
                    } catch (err) {
                        showToast('Google Sign-In failed. Please try email login.', 'error');
                    } finally {
                        reset();
                    }
                }
            });

            client.requestAccessToken({ prompt: 'select_account' });
        }
    </script>

</body>
</html>
