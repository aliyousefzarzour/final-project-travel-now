<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Trips - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
</head>
<body>
    <div id="tn-navbar" data-page="trip-planner"></div>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="close-sidebar" onclick="document.querySelector('.sidebar').classList.remove('open')">
                    <i class="fas fa-times"></i>
                </button>
                <i class="fas fa-user-circle fa-2x" style="color:#d4af37"></i>
                <h3>PROFILE</h3>
                <p id="user-side">Welcome</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
                <li><a href="favorites.html"><i class="fas fa-heart"></i> Favorites</a></li>
                <li><a href="saved-trips.html" class="active"><i class="fas fa-route"></i> Saved Trips</a></li>
                <li><a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="javascript:void(0)" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
                <a href="trip-planner.html" class="btn btn-gold">🗺️ Yala Plan</a>
            </div>
            <div id="trips-container"></div>
        </main>
    </div>

    <div class="modal fade" id="tripModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="background:#0a1d2e; color:#fff; border:1px solid #d4af37;">
                <div class="modal-header" style="border-color:rgba(212,175,55,0.3)">
                    <h5 class="modal-title" style="color:#d4af37">Saved Trip</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="trip-form">
                    <div class="modal-body">
                        <input type="hidden" id="trip-id">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" id="trip-title" required></div>
                            <div class="col-md-3"><label class="form-label">Budget</label><input type="number" class="form-control" id="trip-budget" required></div>
                            <div class="col-md-3"><label class="form-label">Travelers</label><input type="number" class="form-control" id="trip-travelers" required></div>
                            <div class="col-md-4"><label class="form-label">Days</label><input type="number" class="form-control" id="trip-days" required></div>
                            <div class="col-md-4"><label class="form-label">Style</label><input class="form-control" id="trip-style" required></div>
                            <div class="col-md-4"><label class="form-label">Destination</label><input class="form-control" id="trip-destination"></div>
                            <div class="col-12"><label class="form-label">Attractions</label><textarea class="form-control" id="trip-attractions" rows="3"></textarea></div>
                        </div>
                    </div>
                    <div class="modal-footer" style="border-color:rgba(212,175,55,0.3)">
                        <button type="button" class="btn btn-outline-danger" onclick="deleteTripFromModal()">Delete</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-gold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const user = requireAuth();
    const token = Storage.getToken();
    const authHeaders = token ? { Authorization: `Bearer ${token}` } : {};
    let selectedTrip = null;
    if (user) document.getElementById('user-side').textContent = 'Welcome, ' + (user.fullName || user.name || 'Traveler');

    async function fetchJson(url, options = {}) {
        const response = await fetch(url, {
            headers: { 'Content-Type': 'application/json', ...authHeaders, ...(options.headers || {}) },
            ...options
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Request failed');
        return data;
    }

    async function loadTrips() {
        const container = document.getElementById('trips-container');
        container.innerHTML = '<div class="dashboard-card text-center py-5"><div class="spinner-border" style="color:#d4af37"></div><p class="mt-3 text-muted">Loading saved trips...</p></div>';
        try {
            const data = await fetchJson('../api/trips/my');
            const trips = data.trips || [];
            if (!trips.length) {
                container.innerHTML = `
                    <div class="dashboard-card text-center py-5">
                        <div style="font-size:4rem; line-height:1;">🗺️</div>
                        <h3 class="mt-3" style="color:var(--text)">No saved trips yet</h3>
                        <p class="text-secondary">Plan your perfect Egyptian journey with Yala Plan.</p>
                        <a href="trip-planner.html" class="btn btn-gold mt-3">🗺️ Open Yala Plan</a>
                    </div>`;
                return;
            }

            container.innerHTML = trips.map(trip => `
                <div class="dashboard-card mb-3">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                        <div>
                            <h4 style="color:#d4af37">${trip.title}</h4>
                            <p class="mb-1"><strong>Style:</strong> ${trip.style}</p>
                            <p class="mb-1"><strong>Budget:</strong> ${(trip.budget || 0).toLocaleString()} EGP</p>
                            <p class="mb-1"><strong>Days:</strong> ${trip.days}</p>
                        </div>
                        <div class="text-end">
                            <button class="btn btn-action btn-edit" onclick="openTrip('${trip._id}')"><i class="fas fa-pen"></i></button>
                            <button class="btn btn-action btn-delete" onclick="deleteTrip('${trip._id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            container.innerHTML = `<div class="dashboard-card text-center py-5 text-danger">${error.message}</div>`;
        }
    }

    async function deleteTrip(id) {
        try {
            await fetchJson(`../api/trips/${id}`, { method: 'DELETE' });
            showToast('Trip deleted');
            loadTrips();
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function openTrip(id) {
        const data = await fetchJson('../api/trips/my');
        selectedTrip = (data.trips || []).find(trip => String(trip._id) === String(id));
        if (!selectedTrip) {
            showToast('Trip not found', 'error');
            return;
        }
        document.getElementById('trip-id').value = selectedTrip._id;
        document.getElementById('trip-title').value = selectedTrip.title || '';
        document.getElementById('trip-budget').value = selectedTrip.budget || 0;
        document.getElementById('trip-travelers').value = selectedTrip.travelers || 1;
        document.getElementById('trip-days').value = selectedTrip.days || 1;
        document.getElementById('trip-style').value = selectedTrip.style || '';
        document.getElementById('trip-destination').value = selectedTrip.destination || '';
        document.getElementById('trip-attractions').value = (selectedTrip.attractions || []).map(item => item.name).join(', ');
        new bootstrap.Modal(document.getElementById('tripModal')).show();
    }

    async function deleteTripFromModal() {
        if (!selectedTrip) return;
        try {
            await fetchJson(`../api/trips/${selectedTrip._id}`, { method: 'DELETE' });
            showToast('Trip deleted');
            bootstrap.Modal.getInstance(document.getElementById('tripModal')).hide();
            loadTrips();
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    document.getElementById('trip-form').addEventListener('submit', async event => {
        event.preventDefault();
        try {
            await fetchJson(`../api/trips/${document.getElementById('trip-id').value}`, {
                method: 'PUT',
                body: JSON.stringify({
                    title: document.getElementById('trip-title').value,
                    budget: Number(document.getElementById('trip-budget').value),
                    travelers: Number(document.getElementById('trip-travelers').value),
                    days: Number(document.getElementById('trip-days').value),
                    style: document.getElementById('trip-style').value,
                    destination: document.getElementById('trip-destination').value,
                    attractions: document.getElementById('trip-attractions').value.split(',').map(name => ({ name: name.trim() })).filter(item => item.name)
                })
            });
            showToast('Trip updated');
            bootstrap.Modal.getInstance(document.getElementById('tripModal')).hide();
            loadTrips();
        } catch (error) {
            showToast(error.message, 'error');
        }
    });

    loadTrips();
    </script>
</body>
</html>
