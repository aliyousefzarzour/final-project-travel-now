<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attractions - TravelNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <style>
        /* ===== CARD CONTAINER ===== */
        .att-card {
            position: relative;
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 22px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border: 1px solid rgba(212,175,55,0.08);
        }
        body.dark-mode .att-card { background: #1a2a3e; }
        .att-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 50px rgba(212,175,55,0.18);
            border-color: rgba(212,175,55,0.3);
        }

        /* ===== HEART BUTTON ===== */
        .heart-btn {
            position: absolute;
            top: 12px; right: 12px;
            z-index: 10;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.92);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0,0,0,0.18);
            transition: all 0.22s;
            font-size: 1.05rem;
            backdrop-filter: blur(6px);
        }
        .heart-btn:hover { transform: scale(1.18); background: #fff; }
        .heart-btn:hover i { color: #e74c3c; }
        .heart-btn i { color: #ddd; transition: all 0.22s; }
        .heart-btn.saved i { color: #e74c3c; }
        .heart-btn.saving i { color: #ff8a80; animation: beat 0.6s ease infinite; }
        @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }

        /* ===== CARD IMAGE ===== */
        .att-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: linear-gradient(135deg, #0a1d2e, #1a3a5c);
        }
        .att-img-ph {
            width: 100%; height: 200px;
            background: linear-gradient(135deg, #0a1d2e, #1a3a5c);
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; color: rgba(212,175,55,0.25);
        }
        .att-cat-badge {
            position: absolute;
            top: 12px; left: 12px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 10px;
            backdrop-filter: blur(4px);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ===== CARD BODY ===== */
        .att-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .att-title { color: var(--text); font-family: 'Cinzel', serif; font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
        .att-gov { color: #d4af37; font-size: 0.78rem; margin-bottom: 6px; }
        .att-stars { color: #ffc107; font-size: 0.75rem; margin-bottom: 8px; }
        .att-stars span { color: #999; font-size: 0.72rem; margin-left: 3px; }
        
        /* تم ضبط السطر هنا بالكامل لحل مشكلة التحذير المتعرج */
        .att-desc { 
            color: #888; 
            font-size: 0.8rem; 
            line-height: 1.5; 
            flex: 1; 
            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 3; 
            line-clamp: 3; 
            overflow: hidden; 
            margin-bottom: 12px; 
        }
        
        .att-price { color: #d4af37; font-size: 1rem; font-weight: 700; margin-bottom: 10px; }
        .att-view-btn {
            display: block; text-align: center;
            background: linear-gradient(135deg, #d4af37, #c9a227);
            color: #0a1d2e; border: none; border-radius: 10px;
            padding: 9px; font-size: 0.8rem; font-weight: 700;
            text-decoration: none; transition: all 0.2s; cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .att-view-btn:hover { background: linear-gradient(135deg, #c9a227, #b8941f); color: #0a1d2e; transform: translateY(-1px); }
        .att-view-btn:active { transform: translateY(0); }

        /* ===== FAVED COUNTER BAR ===== */
        .fav-bar {
            background: linear-gradient(135deg, #0a1d2e, #152d44);
            border-bottom: 1px solid rgba(212,175,55,0.15);
            color: #d4af37;
            padding: 10px 0;
            text-align: center;
            font-size: 0.88rem;
            display: none;
        }
        .fav-bar a { color: #d4af37; margin-left: 10px; text-decoration: underline; }

        /* ===== SKELETON ===== */
        .sk { background: linear-gradient(90deg, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.04) 75%); background-size: 200%; animation: shimmer 1.3s infinite; border-radius: 18px; height: 380px; }
        body.dark-mode .sk { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%); background-size: 200%; }
        @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }
    </style>
</head>
<body>

<div id="tn-navbar" data-page="attractions"></div>

<div class="page-header">
    <h1><i class="fas fa-landmark"></i> EGYPTIAN ATTRACTIONS</h1>
    <p>Discover Egypt's most iconic destinations — tap ❤️ to save your favorites</p>
</div>

<div class="fav-bar" id="fav-bar">
    <i class="fas fa-heart" style="color:#e74c3c"></i>
    You have saved <strong id="fav-count-num">0</strong> places to your favorites.
    <a href="favorites.html"><i class="fas fa-arrow-right"></i> View Favorites</a>
</div>

<div class="container py-4">
    <div class="search-filter-bar">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search attractions...">
            </div>
            <div class="col-md-3">
                <select id="catFilter" class="form-select">
                    <option value="">All Categories</option>
                    <option value="historical">🏛️ Historical</option>
                    <option value="beach">🏖️ Beach</option>
                    <option value="museums">🏛 Museums</option>
                    <option value="adventure">🧗 Adventure</option>
                    <option value="cultural">🎭 Cultural</option>
                    <option value="natural">🌿 Natural</option>
                    <option value="religious">🕌 Religious</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="govFilter" class="form-select">
                    <option value="">All Governorates</option>
                    <option>Cairo</option><option>Giza</option><option>Alexandria</option>
                    <option>Luxor</option><option>Aswan</option><option>Red Sea</option>
                    <option>South Sinai</option><option>Matruh</option><option>Fayoum</option>
                    <option>New Valley</option><option>Ismailia</option><option>Sohag</option>
                    <option>Minya</option><option>Port Said</option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="sortFilter" class="form-select">
                    <option value="rating">⭐ Top Rated</option>
                    <option value="reviews">💬 Most Visited</option>
                    <option value="name">🔤 A-Z</option>
                </select>
            </div>
        </div>
    </div>
</div>

<div class="container pb-5">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <small class="text-muted" id="result-count"></small>
        <a href="map.html" class="btn btn-outline-gold btn-sm" style="font-size:0.78rem;">
            <i class="fas fa-map-marked-alt"></i> View on Map
        </a>
    </div>
    <div id="attractions-grid" class="row g-4"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/custom-select.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/navbar.js"></script>
<script>
const token      = Storage.getToken();
const authUser   = Storage.get('travelnow-user');
const authHdr    = token ? { Authorization: `Bearer ${token}` } : {};
let attractions  = [];
let favSet       = new Set();
let favIdMap     = {};

const CAT_EMOJI = { historical:'🏛️', religious:'🕌', museums:'🏛', beach:'🏖️', adventure:'🧗', natural:'🌿', cultural:'🎭' };
const FALLBACK_IMAGE = 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Kheops-Pyramid.jpg/1280px-Kheops-Pyramid.jpg';

function getSafeImageUrl(imageUrl) {
    if (!imageUrl) return FALLBACK_IMAGE;

    try {
        const url = new URL(imageUrl, window.location.href);
        const blockedHosts = ['images.unsplash.com', 'images.pexels.com'];
        if (blockedHosts.includes(url.hostname) || url.hostname.endsWith('.unsplash.com')) {
            return FALLBACK_IMAGE;
        }
        return imageUrl;
    } catch (_) {
        return imageUrl || FALLBACK_IMAGE;
    }
}

// ===== API =====
async function api(url, opts = {}) {
    const r = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...authHdr, ...(opts.headers || {}) },
        ...opts
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.message || `HTTP ${r.status}`);
    return d;
}

// ===== FAV STATE =====
async function loadFavState() {
    if (!authUser || !token) return;
    try {
        const data = await api('http://localhost:5000/api/favorites');
        favSet.clear(); favIdMap = {};
        (data.favorites || []).forEach(f => {
            const aId = String(f.attractionId?._id || f.attractionId);
            favSet.add(aId);
            favIdMap[aId] = f._id;
        });
        updateFavBar();
    } catch (_) {}
}

function updateFavBar() {
    const n = favSet.size;
    const bar   = document.getElementById('fav-bar');
    const num   = document.getElementById('fav-count-num');
    const badge = document.getElementById('nav-fav-count');
    if (n > 0) {
        bar.style.display = 'block';
        num.textContent   = n;
        if (badge) {
            badge.textContent = n;
            badge.style.display = 'block';
        }
    } else {
        bar.style.display = 'none';
        if (badge) badge.style.display = 'none';
    }
}

// ===== TOGGLE FAV =====
async function toggleFav(attractionId, event) {
    event.preventDefault();
    event.stopPropagation();

    if (!authUser || !token) {
        showToast('Please login to save favorites', 'error');
        setTimeout(() => window.location.href = 'login.html', 1200);
        return;
    }

    const btn = document.getElementById(`hb-${attractionId}`);
    if (!btn || btn.disabled) return;

    btn.disabled = true;
    const icon = btn.querySelector('i');
    icon.className = 'fas fa-spinner fa-spin';

    const wasFav = favSet.has(String(attractionId));
    try {
        if (wasFav) {
            await api(`http://localhost:5000/api/favorites/by-attraction/${attractionId}`, { method: 'DELETE' });
            favSet.delete(String(attractionId));
            delete favIdMap[String(attractionId)];
            btn.classList.remove('saved');
            icon.className = 'far fa-heart';
            showToast('Removed from favorites');
        } else {
            const data = await api('http://localhost:5000/api/favorites', {
                method: 'POST',
                body: JSON.stringify({ attractionId })
            });
            favSet.add(String(attractionId));
            if (data.favorite?._id) favIdMap[String(attractionId)] = data.favorite._id;
            btn.classList.add('saved');
            icon.className = 'fas fa-heart';
            showToast('❤️ Saved to favorites!');
        }
        updateFavBar();
    } catch (err) {
        if (err.message?.toLowerCase().includes('already')) {
            favSet.add(String(attractionId));
            btn.classList.add('saved');
            icon.className = 'fas fa-heart';
            updateFavBar();
        } else {
            icon.className = wasFav ? 'fas fa-heart' : 'far fa-heart';
            showToast(err.message, 'error');
        }
    } finally {
        btn.disabled = false;
    }
}

// ===== RENDER =====
function renderAttractions(items) {
    const grid  = document.getElementById('attractions-grid');
    const count = document.getElementById('result-count');
    count.textContent = `Showing ${items.length} attraction${items.length !== 1 ? 's' : ''}`;

    if (!items.length) {
        grid.innerHTML = `<div class="col-12 text-center py-5">
            <i class="fas fa-search fa-3x mb-3" style="color:#d4af37; opacity:0.4"></i>
            <h4 style="color:var(--text)">No attractions found</h4>
            <p class="text-muted">Try adjusting your filters</p>
        </div>`;
        return;
    }

    grid.innerHTML = items.map(att => {
        const isFav  = favSet.has(String(att._id));
        const img    = att.images?.[0] || '';
        const emoji  = CAT_EMOJI[att.category] || '📍';
        const price  = att.prices?.egyptian > 0 ? `${att.prices.egyptian} EGP` : 'Free Entry';
        const stars  = '★'.repeat(Math.floor(att.rating || 0)) + '☆'.repeat(5 - Math.floor(att.rating || 0));
        const reviews = Number(att.reviews || 0).toLocaleString();

        const detailHref = `attraction-details.html?id=${att._id}${urlSource === 'trip-planner' ? '&from=trip-planner' : ''}`;
        return `
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="att-card" onclick="window.location.href='${detailHref}'">

                <button class="heart-btn ${isFav ? 'saved' : ''}"
                        id="hb-${att._id}"
                        title="${isFav ? 'Remove from favorites' : 'Add to favorites'}"
                        onclick="toggleFav('${att._id}', event)">
                    <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
                </button>

                <div class="att-cat-badge">${emoji} ${String(att.category).toUpperCase()}</div>

                ${img
                    ? `<img class="att-img" src="${img}" alt="${att.name}"
                           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
                    : ''}
                <div class="att-img-ph" ${img ? 'style="display:none"' : ''}>${emoji}</div>

                <div class="att-body">
                    <div class="att-title">${att.name}</div>
                    <div class="att-gov"><i class="fas fa-map-marker-alt"></i> ${att.governorate}</div>
                    <div class="att-stars">${stars} <span>(${reviews})</span></div>
                    <p class="att-desc">${att.description || ''}</p>
                    <div class="att-price">${price}</div>
                    <a href="${detailHref}" class="att-view-btn" onclick="event.stopPropagation()">
                        <i class="fas fa-eye"></i> View Details
                    </a>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ===== FILTERS =====
function applyFilters() {
    const q    = document.getElementById('searchInput').value.toLowerCase();
    const cat  = document.getElementById('catFilter').value;
    const gov  = document.getElementById('govFilter').value;
    const sort = document.getElementById('sortFilter').value;

    let list = attractions.filter(att => {
        const text = [att.name, att.description, att.governorate, att.location].join(' ').toLowerCase();
        return (!q   || text.includes(q))
            && (!cat || String(att.category).toLowerCase() === cat.toLowerCase())
            && (!gov || String(att.governorate).toLowerCase() === gov.toLowerCase());
    });

    if (sort === 'rating')  list.sort((a, b) => (b.rating  || 0) - (a.rating  || 0));
    if (sort === 'reviews') list.sort((a, b) => (b.reviews || 0) - (a.reviews || 0));
    if (sort === 'name')    list.sort((a, b) => a.name.localeCompare(b.name));

    renderAttractions(list);
}

// ===== LOAD =====
async function loadAttractions() {
    document.getElementById('attractions-grid').innerHTML =
        [1,2,3,4,5,6,7,8].map(() => `<div class="col-lg-3 col-md-4 col-sm-6"><div class="sk"></div></div>`).join('');

    try {
        const data  = await api('http://localhost:5000/api/attractions?limit=300');
        attractions = data.attractions || [];
        await loadFavState();
        applyUrlFilters(); // استخدام الوظيفة الجديدة التي تدعم المحافظات المتعددة
    } catch (err) {
        document.getElementById('attractions-grid').innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="fas fa-exclamation-triangle fa-3x mb-3" style="color:#dc3545"></i>
                <p class="text-danger">${err.message}</p>
                <button class="btn btn-gold mt-2" onclick="loadAttractions()"><i class="fas fa-redo"></i> Retry</button>
            </div>`;
        showToast('Failed to load attractions', 'error');
    }
}

['searchInput','catFilter','govFilter','sortFilter'].forEach(id =>
    document.getElementById(id).addEventListener(id === 'searchInput' ? 'input' : 'change', applyFilters)
);

// URL param pre-filter
const urlParams = new URLSearchParams(window.location.search);
const urlSource = urlParams.get('source');
const urlCat = urlParams.get('cat');
const urlGovs = urlParams.get('govs'); // استلام عدة محافظات

if (urlCat) document.getElementById('catFilter').value = urlCat;

function applyUrlFilters() {
    if (urlGovs) {
        const targetGovs = urlGovs.toLowerCase().split(',');
        const list = attractions.filter(att => {
            const attGov = (att.governorate || '').toLowerCase();
            return targetGovs.some(g => attGov.includes(g) || g.includes(attGov));
        });
        renderAttractions(list);

        // تحديث النص التوضيحي
        const resultCount = document.getElementById('result-count');
        if (resultCount) resultCount.innerHTML += ` (Filtered for multiple destinations)`;
    } else {
        applyFilters();
    }
}

loadAttractions();
</script>
</body>
</html>
