  <text x="132" y="691" fill="#79d6c8" font-family="Arial,sans-serif" font-weight="700" font-size="14" letter-spacing="2">FIRST-YEAR FUNDING ASK</text>
  <text x="132" y="722" fill="#fffaf0" font-family="Arial,sans-serif" font-weight="700" font-size="29">$5,000 USD</text>
  <text x="106" y="836" fill="#97aaba" font-family="Arial,sans-serif" font-size="15">A lean, founder-built 12-month pilot · Figures are planning assumptions, not traction.</text>
