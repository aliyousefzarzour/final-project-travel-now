    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f5d98c"/><stop offset="1" stop-color="#c59339"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#1d6680" stop-opacity=".38"/><stop offset="1" stop-color="#102944" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
