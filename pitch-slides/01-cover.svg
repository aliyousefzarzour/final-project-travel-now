  <text x="105" y="282" fill="#72d7c8" font-family="Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="4">INVESTOR PRESENTATION · 2026</text>
  <text x="100" y="392" fill="#fffaf0" font-family="Arial,sans-serif" font-weight="700" font-size="75">Discover Egypt.</text>
  <text x="100" y="483" fill="#fffaf0" font-family="Arial,sans-serif" font-weight="700" font-size="75">Book with <tspan fill="#e8c779">confidence.</tspan></text>
  <text x="106" y="548" fill="#c6d3df" font-family="Arial,sans-serif" font-size="27">One place to explore, plan and book complete Egypt packages</text>
  <text x="106" y="588" fill="#c6d3df" font-family="Arial,sans-serif" font-size="27">offered and delivered by tourism companies.</text>
