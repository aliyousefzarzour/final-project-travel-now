<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Egypt tourism market evidence</title>
  <desc id="desc">Egypt reported 19 million tourist arrivals in 2025, up approximately 21 percent from 2024. This is an indicator, not a dollar TAM.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081625"/><stop offset="1" stop-color="#102a40"/></linearGradient><linearGradient id="mint" x2="1"><stop stop-color="#72dccb"/><stop offset="1" stop-color="#b6ebd2"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1480" cy="200" r="290" fill="#1b5269" opacity=".15"/>
  <text x="96" y="90" fill="#79d6c8" font-family="Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="3">04 · MARKET EVIDENCE</text>
  <text x="96" y="151" fill="#fffaf0" font-family="Arial,sans-serif" font-weight="700" font-size="45">A large destination. A focused first test.</text>
  <text x="96" y="195" fill="#bdcbd6" font-family="Arial,sans-serif" font-size="21">Use verified tourism arrivals as context—not as a made-up revenue market size.</text>
  <rect x="96" y="253" width="685" height="376" rx="28" fill="#112b3f" stroke="#2b5264"/>
  <text x="144" y="309" fill="#79d6c8" font-family="Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="2">EGYPT · 2025</text>
  <text x="140" y="425" fill="#fffaf0" font-family="Arial,sans-serif" font-weight="700" font-size="96">19M</text>
  <text x="146" y="470" fill="#d6e1e6" font-family="Arial,sans-serif" font-size="23">reported tourist arrivals</text>
  <rect x="143" y="515" width="200" height="58" rx="14" fill="#173d4e"/>
  <text x="164" y="552" fill="#b6ebd2" font-family="Arial,sans-serif" font-weight="700" font-size="24">≈ +21%</text>
  <text x="358" y="539" fill="#d6e1e6" font-family="Arial,sans-serif" font-size="17">year-on-year growth</text>
  <text x="358" y="565" fill="#91a8b5" font-family="Arial,sans-serif" font-size="15">reported for 2025 vs. 2024</text>
  <rect x="820" y="253" width="684" height="376" rx="28" fill="#102537" stroke="#2a4658"/>
  <text x="868" y="309" fill="#e8c779" font-family="Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="2">TRAVELNOW · YEAR-ONE PILOT</text>
  <text x="870" y="421" fill="#fffaf0" font-family="Arial,sans-serif" font-weight="700" font-size="82">100</text>
  <text x="1015" y="404" fill="#eaf0f3" font-family="Arial,sans-serif" font-size="23">completed company-package</text>
  <text x="1015" y="437" fill="#eaf0f3" font-family="Arial,sans-serif" font-size="23">bookings as a test target</text>
  <rect x="866" y="482" width="590" height="93" rx="16" fill="#172f41"/>
  <text x="894" y="519" fill="#82dacb" font-family="Arial,sans-serif" font-weight="700" font-size="17">BOTTOM-UP PILOT GOAL</text>
  <text x="894" y="550" fill="#c6d5dd" font-family="Arial,sans-serif" font-size="16">Validate supply, conversion, fulfilment &amp; unit economics.</text>
  <rect x="96" y="669" width="1408" height="119" rx="20" fill="#0b1c2a" stroke="#344c5d"/>
  <text x="128" y="711" fill="#e8c779" font-family="Arial,sans-serif" font-weight="700" font-size="17">WHAT 19M DOES NOT MEAN</text>
  <text x="128" y="746" fill="#c1ced6" font-family="Arial,sans-serif" font-size="17">Not unique buyers, not online package shoppers, not TravelNow's reachable market, and not a dollar TAM.</text>
  <a href="https://english.ahram.org.eg/NewsContent/1/1238/559795/Egypt/Tourism/Egypt-tourism-records-historic-growth-in--receivin.aspx"><text x="96" y="840" fill="#8da6b5" font-family="Arial,sans-serif" font-size="14">Source: Ahram Online, reporting official Ministry of Tourism &amp; Antiquities figures · 2025</text></a>
  <text x="1504" y="840" text-anchor="end" fill="#71899b" font-family="Arial,sans-serif" font-size="14">05 / 08</text>
</svg>
